# Continuous integration: every push to main and every pull request runs
# the same gates that developers run locally (check-all, tests, builds)
# plus the full three-engine browser matrix. Jobs are grouped to keep
# setup overhead low while still isolating the three toolchains (pnpm
# workspaces, bun, and the Playwright browser suite).
name: checks

on:
  # PRs are covered by the pull_request trigger; restricting push to
  # main stops same-repo PR branches from double-running (two runs per
  # push, in uncancellable distinct concurrency groups).
  push:
    branches: [main]
  pull_request:

# Read-only by principle: nothing here needs write access, and no secrets
# are used anywhere in this workflow.
permissions:
  contents: read

# A new push to the same branch supersedes its in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm comes from the root package.json `packageManager` field, so the
      # CI version always matches what the lockfile was produced with.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies (client + server)
        run: pnpm install --frozen-lockfile

      # The client vitest suite includes the HTTP contract test, which
      # serves the real fixture media, and ffmpeg generates those fixtures.
      - name: Install ffmpeg (fixture bootstrap)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bootstrap test media fixtures
        run: node client/tests/scripts/generate-media.mjs

      # settings.json is user-local (gitignored) but the production
      # typecheck and build statically import it (see client/src/config.ts).
      # The tracked template is shape-compatible, so materialize it for CI.
      - name: Materialize client settings.json from template
        run: cp client/settings.example.json client/settings.json

      - name: Client typecheck + lint
        run: pnpm --dir client run check-all

      - name: Client unit + HTTP contract tests
        run: pnpm --dir client run test

      - name: Client build
        run: pnpm --dir client run build

      - name: Server typecheck + lint
        run: pnpm --dir server run check-all

      - name: Server tests
        run: pnpm --dir server exec vitest run

      - name: Server build
        run: pnpm --dir server run build

  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # The integration suite runs the real ffmpeg/ffprobe binaries; if the
      # package is missing the job must fail honestly, not skip.
      - name: Install ffmpeg/ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: converter

      - name: Typecheck
        run: bun run check-all
        working-directory: converter

      - name: Unit tests
        run: bun run test
        working-directory: converter

      - name: Integration tests (real ffmpeg)
        run: bun run test:integration
        working-directory: converter

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies (client + server)
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (fixture bootstrap)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bootstrap test media fixtures
        run: node client/tests/scripts/generate-media.mjs

      # Browser binaries are large; cache them keyed on the Playwright
      # package version (which pins the browser revisions), not the whole
      # lockfile — unrelated dependency changes then no longer
      # re-download every browser. The apt system packages from
      # --with-deps are cheap and not cached. The restore-key prefix
      # fallback still reuses the previous cache until a matching key is
      # built.
      - name: Resolve Playwright version
        run: >
          echo "PLAYWRIGHT_VERSION=$(pnpm --dir client exec playwright --version
          | sed 's/^Version //')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers (chromium, firefox, webkit + system deps)
        run: pnpm --dir client exec playwright install --with-deps chromium firefox webkit

      # Runs all three configured projects. Where an engine genuinely
      # cannot decode the fixture media (see the decode probe in
      # client/tests/browser/playback.spec.ts), its decode-dependent tests
      # skip with a documented reason instead of failing or being hidden.
      - name: Browser tests (chromium + firefox + webkit)
        run: pnpm --dir client run test:browser

      # The html reporter writes playwright-report/ (also on failure);
      # upload it unconditionally so a red run's report is still pullable.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
